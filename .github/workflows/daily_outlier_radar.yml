name: Daily Psychology Outlier Radar (Google Doc + Telegram)

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC
    - cron: '30 2 * * *'

  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '3'
      limit:
        description: 'Number of outliers to analyze'
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: outlier-radar
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load .env secret if provided
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf "%s\n" "$ENV_FILE_CONTENT" > .env
          fi

      - name: Run Daily Outlier Radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.8-flash'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_QUEUE_FOLDER_ID: ${{ secrets.GDRIVE_QUEUE_FOLDER_ID }}
          GDRIVE_ARCHIVE_FOLDER_ID: ${{ secrets.GDRIVE_ARCHIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          DAYS="${{ github.event.inputs.days || '3' }}"
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          python -m src.outlier_radar.main --days "$DAYS" --limit "$LIMIT"
