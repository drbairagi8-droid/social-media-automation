name: Daily 3x Social Poster (TheKyunProject + @psychologist.uday)

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: '30 1 * * *'
    # 1:00 PM IST = 07:30 UTC
    - cron: '30 7 * * *'
    # 7:00 PM IST = 13:30 UTC
    - cron: '30 13 * * *'

  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform(s) to post to'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - youtube
          - instagram
      dry_run:
        description: 'Dry run (generate AI captions/metadata only without posting)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: social-media-poster
  cancel-in-progress: false

jobs:
  publish-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Social Media Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.8-flash'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_QUEUE_FOLDER_ID: ${{ secrets.GDRIVE_QUEUE_FOLDER_ID }}
          GDRIVE_ARCHIVE_FOLDER_ID: ${{ secrets.GDRIVE_ARCHIVE_FOLDER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MAKE_IG_WEBHOOK_URL: ${{ secrets.MAKE_IG_WEBHOOK_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python -m src.main --platform "$PLATFORM" $DRY_RUN_FLAG
