name: Daily 3x Social Poster (TheKyunProject, @psychologist.uday & Psychologist Uday)

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: '30 1 * * *'
    # 1:00 PM IST = 07:30 UTC
    - cron: '30 7 * * *'
    # 7:00 PM IST = 13:30 UTC
    - cron: '30 13 * * *'

  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform(s) to post to'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - youtube
          - instagram
          - linkedin
      dry_run:
        description: 'Dry run (generate AI captions/metadata only without posting)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: social-media-poster
  cancel-in-progress: false

jobs:
  publish-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load .env secret if provided
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf "%s\n" "$ENV_FILE_CONTENT" > .env
          fi

      - name: Run Social Media Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.8-flash'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_QUEUE_FOLDER_ID: ${{ secrets.GDRIVE_QUEUE_FOLDER_ID }}
          GDRIVE_ARCHIVE_FOLDER_ID: ${{ secrets.GDRIVE_ARCHIVE_FOLDER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MAKE_IG_WEBHOOK_URL: ${{ secrets.MAKE_IG_WEBHOOK_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Remove empty env vars so python-dotenv can load values from .env if ENV_FILE was used
          for var in GEMINI_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN YOUTUBE_REFRESH_TOKEN GDRIVE_QUEUE_FOLDER_ID GDRIVE_ARCHIVE_FOLDER_ID IG_USER_ID IG_ACCESS_TOKEN MAKE_IG_WEBHOOK_URL LINKEDIN_ACCESS_TOKEN LINKEDIN_PERSON_URN; do
            if [ -z "${!var}" ]; then
              unset "$var"
            fi
          done
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python -m src.main --platform "$PLATFORM" $DRY_RUN_FLAG
